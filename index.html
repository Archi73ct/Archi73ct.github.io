<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BechSecurity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #f8f8f8; /* Off-white background */
            color: black;
        }
        .container {
            max-width: 90%;
            padding: 20px;
        }
        h1 {
            font-size: 3vw; /* Scales with screen size */
            font-weight: 600;
            margin: 0;
        }
        p {
            font-size: 1.5vw; /* Scales with screen size */
            margin: 10px 0;
        }
        /* Fallback for very small screens (phones) */
        @media (max-width: 600px) {
            h1 {
                font-size: 6vw;
            }
            p {
                font-size: 4vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BechSecurity</h1>
        <p>Elite solutions for elite challenges.</p>
	<p><span id="contact"></span></p>
	<script>
    		document.getElementById("contact").innerHTML = '<a href="mailto:' + 'contact' + '@' + 'bechsecurity.dk">contact@bechsecurity.dk</a>';
	</script>
    </div>
</body>
</html>
